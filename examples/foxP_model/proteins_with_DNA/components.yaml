# Components config for proteins + DNA (DNA modeled as RNA)
# High restraints on domains to keep them rigid, disordered regions free to move

defaults:
  molecule_type: protein
  nmol: 1
  charge_termini: both
  ffasta: /home/sbali/CALVADOS/examples/foxP_model/proteins_with_DNA/sequences.fasta
  fresidues: /home/sbali/CALVADOS/examples/single_RNA/residues_C2RNA.csv
  pdb_folder: /home/sbali/CALVADOS/examples/foxP_model/input
  fdomains: /home/sbali/CALVADOS/examples/foxP_model/input/domains.yaml

  # Restraint settings - HIGH k_harmonic for rigid domains
  restraint: true
  restraint_type: harmonic
  k_harmonic: 2000.0          # High value = very rigid domains
  cutoff_restr: 0.9           # Distance cutoff for restraints
  ext_restraint: true
  use_com: true

  # Bond stiffness
  kb: 8033.0

  # AlphaFold confidence scaling
  colabfold: 1
  bfac_shift: 0.8
  bfac_width: 50.0
  pae_shift: 0.3
  pae_width: 15.0

  # RNA parameters (for DNA chains)
  rna_kb1: 8033.0
  rna_kb2: 8033.0
  rna_ka: 7.24
  rna_pa: 3.14
  rna_nb_sigma: 0.4
  rna_nb_scale: 15
  rna_nb_cutoff: 0.6

  # Other defaults
  alpha: 0
  periodic: false

system:
  # Proteins
  FOXP4:
    molecule_type: protein
    nmol: 1
  FOX:
    molecule_type: protein
    nmol: 1
  chain_C:
    molecule_type: protein
    nmol: 1

  # DNA chains (modeled as coarse-grained RNA)
  chain_E:
    molecule_type: rna
    nmol: 1
    restraint: true
  chain_F:
    molecule_type: rna
    nmol: 1
    restraint: true
