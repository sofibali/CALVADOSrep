# PARP14 Active Site Definitions
#
# Residue numbers are UniProt **Q460N5** (PARP14_HUMAN, 1801 aa, SV=3).
# Verified byte-identical to the live UniProt record; re-check any time with
#     python examples/PARP14_MDP/sim_analysis/verify_numbering.py
#
# CORRECTED 2026-09-21. The previous catalytic_residues did not match the amino
# acids they were labelled with (e.g. "D831" is a glycine in Q460N5, "H1684" is
# a threonine) and no global offset reconciled them. See
# examples/PARP14_MDP/docs/NUMBERING_AUDIT.md for the full audit.
#
# PROVENANCE OF EACH catalytic_residues ENTRY
# -------------------------------------------
#   MD1  824  conserved macrodomain Asn (V-V-N-A-S-N-E loop); UniProt binding site
#        832  Dukic et al. 2023 (PMC10499325) -- G832E sterically blocks the
#             active site for ADP-ribose binding; the paper's MD1 loss-of-function
#        961  UniProt binding site (Asp)
#   MD2  1034 UniProt binding site
#        1044 Dukic et al. 2023 -- residue corresponding to MD1 G832; G1044E had
#             no discernible effect (MD2 is a reader, not a hydrolase)
#        1135 within UniProt binding site 1133-1137 (G-T-G-N-L)
#        1176 within UniProt binding site 1175-1178 (D-H-E-N)
#   MD3  1247, 1258, 1371 UniProt binding sites
#        1334 within UniProt binding site 1332-1336 (G-T-G-N-A)
#   ART  1682 catalytic His, canonical PARP H-G-T motif (sequence-derived)
#        1699 Dukic et al. 2023 -- R1699A is the ADPr-deficient mutant
#        1714 catalytic Tyr, canonical PARP G-K-G-T-Y-F-A motif (sequence-derived)
#   WWE  UNCHANGED and UNVERIFIED -- derived by structural alignment to RNF146
#        (PDB 3V3L), not from a PARP14 structure. See WWE_notes.
#
# domain_range now follows UniProt's own Domain annotations exactly
# (Macro 1 791-978, Macro 2 1003-1190, Macro 3 1216-1387, WWE 1523-1601,
#  PARP catalytic 1605-1801).
#
# pocket_residues were audited and left as they were -- they already covered
# the UniProt binding sites (MD1 8/8, MD3 10/10, ART contains both H1682 and
# Y1714); MD2 was missing 1048, 1049, 1176, 1177, which have been added.
#
