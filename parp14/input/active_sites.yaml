annotations:
  MD1_notes: 'MD1 is the eraser -- an active ADP-ribosyl hydrolase with glutamate

    specificity (Dukic et al. 2023, PMC10499325).

    The active site adopts a characteristic macrodomain fold.

    Key: G832 -- the G832E mutation sterically blocks the active site for

    ADP-ribose binding and is the loss-of-function control used in that paper.

    (An earlier version of this file claimed ''Asp831 is critical''; residue 831

    in UniProt Q460N5 is a glycine, not an aspartate -- see

    examples/PARP14_MDP/docs/NUMBERING_AUDIT.md.)

    '
  MD2_notes: 'MD2 binds ADP-ribose but has no catalytic activity against modified proteins.

    Functions as a reader domain for ADP-ribosylation marks.

    Has been shown to be important for localization.

    G1044 is the structural equivalent of MD1''s G832; G1044E had no discernible

    effect (Dukic et al. 2023), consistent with MD2 being a reader, not a hydrolase.

    '
  MD3_notes: 'Shows highest affinity for ADP-ribose.

    No shown function in cells or spefic binding partners.

    '
  WWE_notes: 'Binds iso-ADP-ribose (a PAR degradation product), functioning as a PAR reader.

    Residue numbers derived by structural alignment against RNF146 (PDB 3V3L),

    not a PARP14-specific ligand-bound structure -- no such structure exists yet

    (1X4R is apo; 3GOY only has a small-molecule inhibitor bound in ART).

    RNF146 lacks 2 of its 4 conserved iso-ADPR-contacting residues in PARP14''s

    WWE domain (Wang et al. 2012), so treat this as a working hypothesis.

    '
  ART_notes: 'ART domain transfers ADP-ribose from NAD+ to targets; the primary enzymatic

    function of PARP14 and a therapeutic target.

    PARP14 is a MONO-ADP-ribosyltransferase (UniProt Q460N5 protein name:

    ''Protein mono-ADP-ribosyltransferase PARP14''). Its triad is therefore

    H-Y-[I/L/V], NOT the H-Y-E of the poly-ARTs PARP1/2 -- there is no catalytic

    glutamate. An earlier version of this file asserted an ''H-Y-E catalytic motif''

    at 1684/1705/1706; those positions are T/N/A in Q460N5.

    H1682 and Y1714 are read directly off the canonical PARP motifs in the

    sequence (H-G-T at 1682, G-K-G-T-Y-F-A at 1710). The third triad position is

    NOT established by the cited paper and is deliberately not listed here.

    R1699A is the ADPr-deficient catalytic mutant (Dukic et al. 2023).

    '
