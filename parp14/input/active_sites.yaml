# Additional annotations for reference
annotations:
  MD1_notes: |
    MD1 has weak ADP-ribose binding affinity.
    MD1 is the eraser - hydrolitic activity.
    The active site adopts a characteristic macrodomain fold.
    Key: Asp831 is critical for substrate hydrolysis.

  MD2_notes: |
    MD2 binds ADP-ribose but has no catalytic activity agains modified proteins.
    Functions as a reader domain for ADP-ribosylation marks.
    Has been shown to be impportant for localization. 

  MD3_notes: |
    Shows highest affinity for ADP-ribose.
    No shown function in cells or spefic binding partners.
  ART_notes: |
    ART domain transfers ADP-ribose from NAD+ to targets.
    H-Y-E catalytic motif is essential for activity.
    Primary enzymatic function of PARP14.
    Inhibition of this domain is a therapeutic target.
